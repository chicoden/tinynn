function paint(grid, x, y) {
    let i = Math.floor(x / CELL_WIDTH);
    let j = Math.floor(y / CELL_HEIGHT);
    for (let y = j; y < j + 2; y++) {
        for (let x = i; x < i + 2; x++) {
            grid[y][x] = 1;
        }
    }
}

function clear(grid) {
    for (let y = 0; y < GRID_HEIGHT; y++) {
        for (let x = 0; x < GRID_WIDTH; x++) {
            grid[y][x] = 0;
        }
    }
}

async function save(grid) {
    let canvas = new OffscreenCanvas(GRID_WIDTH, GRID_HEIGHT);
    let ctx = canvas.getContext("2d");
    for (let y = 0; y < GRID_HEIGHT; y++) {
        for (let x = 0; x < GRID_WIDTH; x++) {
            let value = Math.floor(grid[y][x] * 255).toString(16).padStart(2, "0");
            ctx.fillStyle = "#" + value + value + value;
            ctx.fillRect(x, y, 1, 1);
        }
    }

    let file_name = prompt("enter file name");
    if (file_name !== null) {
        let anchor = document.createElement("a");
        anchor.download = file_name + ".png";
        anchor.href = URL.createObjectURL(await canvas.convertToBlob());
        anchor.click();
        URL.revokeObjectURL(anchor.href);
    }
}

clear_button.addEventListener("click", () => clear(grid));
save_button.addEventListener("click", () => save(grid));

let mouse_drag = false;
canvas.addEventListener("mousedown", (event) => {
    mouse_drag = true;
    paint(grid, event.clientX, event.clientY);
});
canvas.addEventListener("mousemove", (event) => {
    if (mouse_drag) {
        paint(grid, event.clientX, event.clientY);
    }
});
canvas.addEventListener("mouseup", (event) => {
    mouse_drag = false;
});

requestAnimationFrame(function render() {
    for (let y = 0; y < GRID_HEIGHT; y++) {
        for (let x = 0; x < GRID_WIDTH; x++) {
            let value = Math.floor(grid[y][x] * 255).toString(16).padStart(2, "0");
            ctx.fillStyle = "#" + value + value + value;
            ctx.fillRect(x * CELL_WIDTH, y * CELL_HEIGHT, CELL_WIDTH, CELL_HEIGHT);
        }
    }
    requestAnimationFrame(render);
});
